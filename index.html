<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPTEC - Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <div class="mobile-frame">
        <div id="view-login" class="login-screen">
            <div class="login-card">
                <div class="logo-placeholder">
                    <img src="logo.jpg" alt="Logo"
                        style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
                </div>
                <h2>BIENVENIDO A SIPTEC</h2>
                <p class="subtitle-login">Sistema de préstamo e inventario de área técnica</p>
                <p class="instruction">Ingresa tus credenciales para acceder al sistema</p>

                <form id="login-form">
                    <div class="form-group-login">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" required placeholder="ejemplo@ricaldone.edu.sv">
                    </div>

                    <div class="form-group-login">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                </form>

                <p class="footer-login">
                    Desarrollado por Equipo PTC de 2 año de bachillerato de software 2A
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            // Aquí es donde luego se valida contra el backend real.
            window.location.href = 'pages/app.html';
        });
    </script>
</body>

</html>
