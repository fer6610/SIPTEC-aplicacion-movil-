<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPTEC - Sistema de Préstamo e Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>

<body>

    <div class="mobile-frame">
        <div class="app-screen">
            <div id="viewRoot" class="content"></div>

            <nav class="bottom-nav">
                <button class="nav-item" data-view="dashboard">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </button>
                <button class="nav-item" data-view="prestamos">
                    <i class="fa-solid fa-right-left"></i>
                    <span>Préstamos</span>
                </button>
                <button class="nav-item" data-view="reportes">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>Reportes</span>
                </button>
                <button class="nav-item" data-view="devolucion">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Devolución</span>
                </button>
            </nav>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>

</html>
