<div class="encabezado">
    <h1>Generar reportes</h1>
    <i class="fa-solid fa-bell icono-notificacion"></i>
</div>
<div class="subtitulo-encabezado">Genera y consulta reportes del sistema.</div>

<div class="titulo-tarjeta" style="margin-bottom:6px;">1. Tipo de reporte</div>

<input type="radio" name="tipoReporte" id="repPrestamosActivos" class="radio-tipo-reporte" checked>
<label class="tarjeta-seleccion-reporte" for="repPrestamosActivos">
    <div>
        <div class="title">Préstamos activos</div>
        <div class="desc">Equipos actualmente prestados</div>
    </div>
    <i class="fa-solid fa-arrow-right"></i>
</label>

<input type="radio" name="tipoReporte" id="repHistorial" class="radio-tipo-reporte">
<label class="tarjeta-seleccion-reporte" for="repHistorial">
    <div>
        <div class="title">Historial de préstamos</div>
        <div class="desc">Todos los préstamos realizados</div>
    </div>
    <i class="fa-solid fa-arrow-right"></i>
</label>

<input type="radio" name="tipoReporte" id="repDevoluciones" class="radio-tipo-reporte">
<label class="tarjeta-seleccion-reporte" for="repDevoluciones">
    <div>
        <div class="title">Devoluciones</div>
        <div class="desc">Historial de devoluciones</div>
    </div>
    <i class="fa-solid fa-arrow-right"></i>
</label>

<input type="radio" name="tipoReporte" id="repDanados" class="radio-tipo-reporte">
<label class="tarjeta-seleccion-reporte" for="repDanados" style="margin-bottom:14px;">
    <div>
        <div class="title">Equipos con daño</div>
        <div class="desc">Equipos reportados con daño</div>
    </div>
    <i class="fa-solid fa-arrow-right"></i>
</label>

<div style="margin-bottom: 14px;">
    <div class="titulo-tarjeta" style="margin-bottom:6px;">2. Rango de fechas</div>
    <div class="rango-fechas">
        <input type="date" class="campo-fecha" id="reporteFechaInicio" required>
        <span style="font-size:10px;">a</span>
        <input type="date" class="campo-fecha" id="reporteFechaFin" required>
    </div>
</div>

<button class="boton-accion-gris" onclick="Swal.fire({icon: 'info', title: 'Generando reporte...', text: 'Esto puede tardar unos segundos.', confirmButtonColor: '#6c757d'});">Generar reporte</button>
<button class="boton-accion-contorno">Ver reportes generados</button>
