<div class="header">
                    <h1>Nuevo préstamo</h1>
                    <i class="fa-solid fa-bell notification-icon"></i>
                </div>
                <div class="header-subtitle">Registra un nuevo préstamo de equipo.</div>

                <div class="card-box">
                    <div class="card-title">1. Seleccionar equipo</div>
                    <div class="search-input-box">
                        <input type="text" placeholder="Escanea o busca el equipo">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <a class="link-blue-center">Buscar manualmente</a>
                </div>

                <div class="card-box">
                    <div class="card-title">2. Empleado que recibe</div>
                    <div class="search-input-box">
                        <input type="text" placeholder="Buscar empleado">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <a class="link-blue-center">Buscar manualmente</a>
                </div>

                <div class="card-box">
                    <div class="card-title">3. Fecha del préstamo</div>
                    <div class="date-range-flex">
                        <input type="date" class="date-input-pill" id="fechaInicio" required>
                        <span>a</span>
                        <input type="date" class="date-input-pill" id="fechaEsperada" required>
                    </div>
                    <small style="display:block; margin-top:6px; font-size:9px; color:var(--ink-soft);">
                        La fecha de devolución esperada no puede ser mayor a 1 mes desde el inicio.
                    </small>
                </div>

                <div class="card-box">
                    <div class="card-title">4. Observaciones (opcional)</div>
                    <textarea class="textarea-box" placeholder="Escribe observaciones..." maxlength="150" oninput="document.getElementById('c1').innerText = this.value.length"></textarea>
                    <div class="char-counter"><span id="c1">0</span>/150</div>
                </div>

                <button class="btn-action-navy" onclick="alert('¡Préstamo registrado con éxito!')">Registrar préstamos</button>
