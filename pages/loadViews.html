<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPTEC - Sistema de Préstamo e Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

    <div class="mobile-frame">
        <div class="app-screen">
            <div id="viewRoot" class="content"></div>

            <nav class="bottom-nav">
                <button id="btnNavInicio" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </button>
                <button id="btnNavPrestamos" class="nav-item">
                    <i class="fa-solid fa-right-left"></i>
                    <span>Préstamos</span>
                </button>
                <button id="btnNavReportes" class="nav-item">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>Reportes</span>
                </button>
                <button id="btnNavDevolucion" class="nav-item">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>Devolución</span>
                </button>
            </nav>
        </div>
    </div>

    <script type="module" src="../js/loadViews.js"></script>
</body>
</html>
